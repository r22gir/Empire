# Optional host overlay. Does not change ports 8000 / 3000 / 3005.
# Workroom's lock lives under empire-data/run, not /tmp.
# The x line excludes the legacy /tmp name from systemd-tmpfiles cleanup
# if a leftover file is still there during the transition.
d /home/rg/empire-data/run 0755 rg rg -
x /tmp/empire_primary_worker.lock
