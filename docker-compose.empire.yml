# Empire backend + Command Center portal for cloud-move prep.
# Copy .env.example to .env and fill values locally. Never commit .env.
# Usage: docker compose -f docker-compose.empire.yml up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      EMPIRE_DATA_DIR: /data
      EMPIRE_TASK_DB: /data/empire.db
      EMPIRE_RELIST_SANDBOX_DB: /data/relist_sandbox.db
      EMPIRE_ENV: ${EMPIRE_ENV:-sandbox}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3005}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - empire_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 8s
      retries: 3
    restart: unless-stopped

  portal:
    build:
      context: ./empire-command-center
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_BACKEND_UPSTREAM: http://backend:8000
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_BACKEND_UPSTREAM: http://backend:8000
      PORT: 3005
    ports:
      - "${PORTAL_PORT:-3005}:3005"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  empire_data:
