  <text x="400" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a8a29e">Willard CST-23 Reviewed Piece: Wood cut = true size. Foam cut = same as wood. Fabric cut = +2" to 3" for stapling.</text>

