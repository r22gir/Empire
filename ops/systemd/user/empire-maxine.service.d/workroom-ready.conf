# Overlay for the live Dell user unit. Same family lock-path guard as Max-e.
# Clears any flock-on-/tmp ExecStartPre so it cannot recreate the lock name.
# Does not wait on Workroom lock or health. Maxine starts when Workroom is down.
#
#   mkdir -p ~/.config/systemd/user/empire-maxine.service.d
#   cp ops/systemd/user/empire-maxine.service.d/workroom-ready.conf \
#      ~/.config/systemd/user/empire-maxine.service.d/workroom-ready.conf
#   systemctl --user daemon-reload

[Service]
Environment=EMPIRE_WORKER_LOCK=/data/maxine/run/empire_primary_worker.lock
ExecStartPre=
ExecStartPre=/home/rg/empire-maxine/deploy/workroom_primary_ready.sh
