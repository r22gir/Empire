# Overlay for the live Dell user unit. Clears the Oct 23 flock-on-/tmp
# ExecStartPre (that command creates a new inode if the name was unlinked)
# and installs the shared family lock-path guard. Same script as Maxine.
# The guard refuses Workroom lock paths and does not wait on Workroom
# lock or health. Max-e starts when empire-backend is down.
#
#   mkdir -p ~/.config/systemd/user/empire-amp.service.d
#   cp ops/systemd/user/empire-amp.service.d/workroom-ready.conf \
#      ~/.config/systemd/user/empire-amp.service.d/workroom-ready.conf
#   systemctl --user daemon-reload
#
# Do not restart empire-backend / empire-portal. Ports 8000 / 3000 / 3005 stay.

[Service]
Environment=EMPIRE_WORKER_LOCK=/data/amp/run/empire_primary_worker.lock
ExecStartPre=
ExecStartPre=/home/rg/empire-amp/deploy/workroom_primary_ready.sh
